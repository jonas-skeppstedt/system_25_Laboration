name: CI

on:
  push:
    branches:
      - main

  pull_request:
     branches:
        - main
        
  workflow_dispatch:
  
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: action/checkout@v7
      - uses: action/setup-dotnet@6
        with: 
          dotnet version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build no restore
        run: dotnet build --no-restore --configuration Release
      - name: Test no build
        run: dotnet test --no-build --configuration Release
      
  
  
